<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Image</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
             <nav>
                <a href="advanced.html">Advanced seach</a>
                <a href="index.html">Google seach</a>
             </nav>
        </header>
        <main>
            <div class="container">
                <img src="download.png" alt="Image description">
                <form action="https://www.google.com/search" method="get">
                    <input type="hidden" name="tbm" value="isch">
                    <input type="text" name="q" class="search-text" placeholder="Search for an image">
                    <input type="submit" value="Google Search" class="search-button">
                </form>                
            </div>
        </main>
        </body>
