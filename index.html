<!DOCTYPE html>
<html lang="en">
<head>
    <title>Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="advanced.html" style="text-align: center;">Advanced search</a>
            <a href="image.html">Image search</a>
        </nav>
    </header>
    <main>
        <div class="container">
            <img src="download.png" alt="Image description">
            <form action="https://www.google.com/search">
                <input type="text" name="q" class="search-text" placeholder="Search">
                <input type="submit" value="Google Search" class="search-button">
            </form>
        </div>
    </main>
</body>
</html>
